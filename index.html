<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Construction | Coming Soon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a192f, #0d213f, #112d4e);
            color: #e6f1ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            padding: 40px 30px;
            background: rgba(17, 34, 64, 0.7);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 10, 30, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(64, 156, 255, 0.2);
            position: relative;
            z-index: 1;
        }
        
        .construction-icon {
            font-size: 5rem;
            color: #64ffda;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
            filter: drop-shadow(0 0 10px rgba(100, 255, 218, 0.3));
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #64ffda;
            text-shadow: 0 2px 10px rgba(100, 255, 218, 0.3);
        }
        
        h2 {
            font-size: 2rem;
            margin-bottom: 30px;
            font-weight: 400;
            color: #ccd6f6;
        }
        
        .message {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            color: #a8b2d1;
        }
        
        /* Worker Animation Container */
        .worker-container {
            width: 300px;
            height: 250px;
            margin: 0 auto 40px;
            position: relative;
        }
        
        .desk {
            width: 100%;
            height: 20px;
            background: #1e3a5f;
            border-radius: 5px;
            position: absolute;
            bottom: 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .computer {
            width: 120px;
            height: 90px;
            background: #1a365d;
            border-radius: 10px;
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 2px solid #2d4a7a;
        }
        
        .screen {
            width: 100px;
            height: 70px;
            background: #0a192f;
            border-radius: 5px;
            position: absolute;
            top: 10px;
            left: 10px;
            overflow: hidden;
            border: 1px solid #64ffda;
        }
        
        .screen-content {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #112d4e 25%, #1e3a5f 50%, #112d4e 75%);
            background-size: 200% 100%;
            animation: loading 2s infinite linear;
        }
        
        .worker {
            width: 80px;
            height: 120px;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-80px);
        }
        
        .head {
            width: 50px;
            height: 50px;
            background: #f1c27d;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 15px;
        }
        
        .body {
            width: 70px;
            height: 70px;
            background: #2d4a7a;
            border-radius: 10px;
            position: absolute;
            top: 45px;
            left: 5px;
        }
        
        .arm {
            width: 60px;
            height: 15px;
            background: #1e3a5f;
            border-radius: 7px;
            position: absolute;
            top: 60px;
            left: 75px;
            transform-origin: left center;
            animation: typing 1s infinite alternate;
        }
        
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        
        .countdown-box {
            background: rgba(30, 58, 95, 0.6);
            border-radius: 10px;
            padding: 20px 15px;
            min-width: 100px;
            border: 1px solid rgba(100, 255, 218, 0.3);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        
        .countdown-box:hover {
            transform: translateY(-5px);
            border-color: #64ffda;
        }
        
        .countdown-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #64ffda;
            display: block;
            text-shadow: 0 0 10px rgba(100, 255, 218, 0.5);
        }
        
        .countdown-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
            color: #ccd6f6;
        }
        
        .progress-bar {
            width: 100%;
            max-width: 500px;
            height: 12px;
            background: #1e3a5f;
            border-radius: 10px;
            margin: 30px auto;
            overflow: hidden;
            border: 1px solid rgba(100, 255, 218, 0.2);
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #112d4e, #64ffda);
            border-radius: 10px;
            width: 50%;
            transition: width 0.5s ease;
        }
        
        .progress-text {
            color: #a8b2d1;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        
        .notify-btn {
            background: linear-gradient(to right, #112d4e, #1e3a5f);
            color: #64ffda;
            border: 2px solid #64ffda;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .notify-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(100, 255, 218, 0.2);
            background: linear-gradient(to right, #1e3a5f, #2d4a7a);
        }
        
        .footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #8892b0;
        }
        
        /* Animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes typing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(10deg); }
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* Floating elements in background */
        .floating {
            position: absolute;
            border-radius: 50%;
            background: rgba(100, 255, 218, 0.05);
            animation: float 20s infinite linear;
            z-index: 0;
        }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
        }
        
        /* Code lines on screen */
        .code-line {
            position: absolute;
            width: 80%;
            height: 4px;
            background: #64ffda;
            left: 10%;
            border-radius: 2px;
            opacity: 0.3;
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            h2 { font-size: 1.5rem; }
            .worker-container { transform: scale(0.8); }
            .countdown-box { min-width: 80px; padding: 15px 10px; }
            .countdown-value { font-size: 2rem; }
        }
        
        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .container { padding: 30px 20px; }
            .countdown-box { min-width: 70px; padding: 12px 8px; }
            .countdown-value { font-size: 1.8rem; }
            .notify-btn { padding: 15px 30px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <!-- Floating background elements -->
    <div id="floatingElements"></div>
    
    <div class="container">
        <div class="construction-icon">
            <i class="fas fa-tools"></i>
        </div>
        
        <h1>UNDER CONSTRUCTION</h1>
        <h2>Website Coming Soon</h2>
        
        <div class="worker-container">
            <div class="worker">
                <div class="head"></div>
                <div class="body"></div>
                <div class="arm"></div>
            </div>
            <div class="desk"></div>
            <div class="computer">
                <div class="screen">
                    <div class="screen-content" id="screenContent">
                        <!-- Code lines will be added by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
        
        <p class="message">
            Our website is currently under construction. We're working hard to bring you an amazing experience.
            The site will be live in 30 days with exciting new features and content.
        </p>
        
        <div class="countdown-container">
            <div class="countdown-box">
                <span class="countdown-value" id="days">30</span>
                <span class="countdown-label">Days</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-value" id="hours">00</span>
                <span class="countdown-label">Hours</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-value" id="minutes">00</span>
                <span class="countdown-label">Minutes</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-value" id="seconds">00</span>
                <span class="countdown-label">Seconds</span>
            </div>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text">Progress: 50% Complete</div>
        
        <button class="notify-btn" id="notifyBtn">
            <i class="fas fa-bell"></i> Notify Me When Online
        </button>
        
        <div class="footer">
            <p>&copy; <span id=""></span>  kasun weerasinghe</p>
        </div>
    </div>

    <script>
        // Set current year in footer
        document.getElementById('currentYear').textContent = new Date().getFullYear();
        
        // Countdown timer (setting launch date to exactly 30 days from now)
        const launchDate = new Date();
        launchDate.setDate(launchDate.getDate() + 30);
        launchDate.setHours(12, 0, 0, 0); // Set to noon
        
        // Set progress bar to 50% (fixed, not dynamic)
        document.getElementById('progressFill').style.width = '50%';
        
        // Update countdown every second
        function updateCountdown() {
            const now = new Date().getTime();
            const timeLeft = launchDate - now;
            
            // Calculate days, hours, minutes, seconds
            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
            
            // Display the values
            document.getElementById('days').textContent = days.toString().padStart(2, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            
            // If countdown is finished
            if (timeLeft < 0) {
                clearInterval(countdownInterval);
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                document.getElementById('progressFill').style.width = '100%';
                document.querySelector('.progress-text').textContent = 'Progress: 100% Complete - Site is LIVE!';
                
                // Create a celebration effect
                createCelebration();
            }
        }
        
        // Initial call and set interval
        updateCountdown();
        const countdownInterval = setInterval(updateCountdown, 1000);
        
        // Notify button functionality
        document.getElementById('notifyBtn').addEventListener('click', function() {
            const originalText = this.innerHTML;
            const originalBorder = this.style.border;
            
            this.innerHTML = '<i class="fas fa-check"></i> You Will Be Notified!';
            this.style.border = '2px solid #4CAF50';
            this.style.color = '#4CAF50';
            
            // Create and show a simple notification
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: rgba(30, 58, 95, 0.95);
                color: #64ffda;
                padding: 15px 25px;
                border-radius: 10px;
                z-index: 1000;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                animation: slideIn 0.5s ease;
                border: 1px solid #64ffda;
                max-width: 300px;
            `;
            
            // Add CSS for animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slideIn {
                    from { transform: translateX(100%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
                @keyframes slideOut {
                    from { transform: translateX(0); opacity: 1; }
                    to { transform: translateX(100%); opacity: 0; }
                }
            `;
            document.head.appendChild(style);
            
            notification.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i class="fas fa-check-circle" style="color:#64ffda; font-size:1.2rem;"></i>
                    <div>
                        <strong>Notification Request Sent</strong><br>
                        <small style="color:#a8b2d1;">We'll email you when the site is live</small>
                    </div>
                </div>
            `;
            document.body.appendChild(notification);
            
            // Remove notification after 4 seconds
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.5s ease';
                setTimeout(() => {
                    if (notification.parentNode) {
                        document.body.removeChild(notification);
                        document.head.removeChild(style);
                    }
                }, 500);
            }, 4000);
            
            // Reset button after 5 seconds
            setTimeout(() => {
                this.innerHTML = originalText;
                this.style.border = originalBorder;
                this.style.color = '#64ffda';
            }, 5000);
        });
        
        // Create floating background elements
        function createFloatingElements() {
            const container = document.getElementById('floatingElements');
            const colors = [
                'rgba(100, 255, 218, 0.05)',
                'rgba(64, 156, 255, 0.05)',
                'rgba(100, 150, 255, 0.05)',
                'rgba(30, 58, 95, 0.05)',
                'rgba(17, 45, 78, 0.05)'
            ];
            
            for (let i = 0; i < 25; i++) {
                const element = document.createElement('div');
                element.classList.add('floating');
                
                // Random size between 10 and 80px
                const size = Math.random() * 70 + 10;
                
                // Random position
                const left = Math.random() * 100;
                
                // Random animation delay and duration
                const delay = Math.random() * 15;
                const duration = Math.random() * 15 + 15;
                
                // Random color
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                element.style.width = `${size}px`;
                element.style.height = `${size}px`;
                element.style.left = `${left}%`;
                element.style.top = `${100 + Math.random() * 20}%`;
                element.style.animationDelay = `${delay}s`;
                element.style.animationDuration = `${duration}s`;
                element.style.background = color;
                
                // Add some elements with borders
                if (Math.random() > 0.7) {
                    element.style.border = '1px solid rgba(100, 255, 218, 0.1)';
                }
                
                container.appendChild(element);
            }
        }
        
        // Create code lines on the computer screen
        function createCodeLines() {
            const screenContent = document.getElementById('screenContent');
            const lineCount = 8;
            
            for (let i = 0; i < lineCount; i++) {
                const line = document.createElement('div');
                line.classList.add('code-line');
                
                // Random position
                const top = 10 + i * 20;
                const width = 60 + Math.random() * 30;
                
                line.style.top = `${top}px`;
                line.style.width = `${width}%`;
                line.style.left = `${10 + Math.random() * 10}%`;
                
                // Random opacity
                line.style.opacity = 0.2 + Math.random() * 0.4;
                
                // Random animation for some lines
                if (Math.random() > 0.5) {
                    line.style.animation = `loading ${2 + Math.random() * 3}s infinite linear`;
                }
                
                screenContent.appendChild(line);
            }
        }
        
        // Create celebration effect when countdown finishes
        function createCelebration() {
            const colors = ['#64ffda', '#4CAF50', '#2196F3', '#FF9800', '#E91E63'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.style.cssText = `
                    position: fixed;
                    width: 10px;
                    height: 10px;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                    border-radius: 50%;
                    top: -20px;
                    left: ${Math.random() * 100}vw;
                    z-index: 1000;
                    animation: fall ${Math.random() * 3 + 2}s linear forwards;
                `;
                
                const confettiStyle = document.createElement('style');
                confettiStyle.textContent = `
                    @keyframes fall {
                        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
                        100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
                    }
                `;
                
                document.head.appendChild(confettiStyle);
                document.body.appendChild(confetti);
                
                // Remove confetti after animation
                setTimeout(() => {
                    if (confetti.parentNode) {
                        document.body.removeChild(confetti);
                        document.head.removeChild(confettiStyle);
                    }
                }, 5000);
            }
        }
        
        // Initialize everything when page loads
        window.addEventListener('load', function() {
            createFloatingElements();
            createCodeLines();
            
            // Add blinking cursor to computer screen
            const cursor = document.createElement('div');
            cursor.style.cssText = `
                position: absolute;
                width: 3px;
                height: 20px;
                background: #64ffda;
                top: 30px;
                left: 50%;
                animation: blink 1s infinite;
                opacity: 0.8;
            `;
            
            const cursorStyle = document.createElement('style');
            cursorStyle.textContent = `
                @keyframes blink {
                    0%, 50% { opacity: 1; }
                    51%, 100% { opacity: 0; }
                }
            `;
            
            document.head.appendChild(cursorStyle);
            document.getElementById('screenContent').appendChild(cursor);
            
            // Move cursor around
            setInterval(() => {
                const top = 10 + Math.random() * 50;
                const left = 10 + Math.random() * 70;
                cursor.style.top = `${top}px`;
                cursor.style.left = `${left}%`;
            }, 2000);
            
            // Add some sparkle to countdown boxes
            const countdownBoxes = document.querySelectorAll('.countdown-box');
            countdownBoxes.forEach(box => {
                box.addEventListener('mouseenter', function() {
                    this.style.boxShadow = '0 10px 20px rgba(100, 255, 218, 0.2)';
                });
                
                box.addEventListener('mouseleave', function() {
                    this.style.boxShadow = '0 5px 15px rgba(0, 0, 0, 0.2)';
                });
            });
        });
    </script>
</body>
</html>
